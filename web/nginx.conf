# Use the upstream X-Forwarded-Proto if present (we sit behind another
# reverse proxy that terminates TLS); otherwise fall back to $scheme.
map $http_x_forwarded_proto $forwarded_proto {
  default $scheme;
  ~. $http_x_forwarded_proto;
}

map $http_x_forwarded_for $forwarded_for {
  default $proxy_add_x_forwarded_for;
  ~. $http_x_forwarded_for;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 4M;

  # API + auth + uploaded logos all proxied to the api service.
  # The /api/ prefix is stripped before being forwarded.
  location /api/ {
    proxy_pass http://api:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-For $forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # SPA history fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
